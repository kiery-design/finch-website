<!doctype html>
<!--
  Netlify Forms detection file. Netlify scans this static HTML at deploy time so it
  knows the "contact" and "newsletter" forms exist. Only used when the matching
  provider is set to "netlify" in src/config/site.ts. Visitors never see this page.
-->
<html>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="business" />
      <select name="topic"><option>x</option></select>
      <textarea name="message"></textarea>
    </form>
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="email" />
      <input name="source" />
    </form>
  </body>
</html>
